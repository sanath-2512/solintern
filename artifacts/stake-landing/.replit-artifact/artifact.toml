kind = "web"
previewPath = "/"
title = "Stake Landing Page"
version = "1.0.0"
id = "artifacts/stake-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20361

[services.development]
run = "pnpm --filter @workspace/stake-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stake-landing", "run", "build" ]
publicDir = "artifacts/stake-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20361"
BASE_PATH = "/"
